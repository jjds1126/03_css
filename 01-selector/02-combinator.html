<h2>div p (자손)</h2>

    <p>A</P>

        <p>
           B (손자)
    </p>

<h2>div &gt; p (자식)</h2>

    <p>A</p>

        <p>B (손자)</p>

<h2>section + p (인접 형제)</h2>

        <p>B (손자)</p>
    </section>
    <P>C</P>
    <p>D</p>
    </div>

<h2>p ~ p (일반 형제)</h2>
<div class="bax sibling">
    <p>A</p>
    <section>
        <p>B (손자)</p>
    </section>
    <P>C</P>
</div>
