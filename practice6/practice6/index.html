<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Practice 6</title>
    <link rel="stylesheet" href="index.css"/>
</head>
<body>
    <div class="left-container">
        <div class="left-header">
            <div class="header-title">
                <h2>Device Management</h2>
                <span class="device-count">Total 4 Devices</span>
            </div>
            <button class="btn-add">+ Add Device</button>
        </div>
        <table class="data-table">
            <thead>
            <tr>
                <th>DEVICE NAME</th>
                <th>LOCATION</th>
                <th>STATUS</th>
                <th>BATTERY</th>
                <th>ACTIONS</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>
                    <div class="device-info">
                    <div class="icon-box icon-light"></div>
                    <span class="device-name">Smart Bulb A</span>
                    </div>
                </td>
                <td>Living Room</td>
                <td>
                    <div class="status-badge badge-online">
                        <div class="stats-dot"></div>
                        <span>Online</span>
                    </div>
                </td>
                <td>
                    <div class="battery-wrapper">
                        <div class="battery-bar">
                            <div class="battery-fill" style="=width: 85%"></div>
                        </div>
                        <div class="battery-text">85%</div>
                    </div>
                </td>
                <td>
                    <button class="btn-adit">Edit</button>
                </td>
            </tr>

            <!----------->
            <tr>
                <td>
                    <div class="device-info">
                        <div class="icon-box icon-thermostat"></div>
                        <span class="device-name">Main Thermostat</span>
                    </div>
                </td>

                <td>Hallway</td>

                <td>
                    <div class="status-badge badge-offline">
                        <div class="stats-dot"></div>
                        <span>Offline</span>
                    </div>
                </td>

                <td>
                    <div class="battery-wrapper">
                        <div class="battery-bar">
                            <div class="battery-fill battery-offline"
                                 style="width: 15%"></div>
                        </div>
                        <div class="battery-text">15%</div>
                    </div>
                </td>

                <td>
                    <button class="btn-adit">Edit</button>
                </td>
            </tr>
        <!---------------->
            <tr>
                <td>
                    <div class="device-info">
                        <div class="icon-box icon-plug"></div>
                        <span class="device-name">Coffee Maker Plug</span>
                    </div>
                </td>

                <td>Kitchen</td>

                <td>
                    <div class="status-badge badge-online">
                        <div class="stats-dot"></div>
                        <span>Online</span>
                    </div>
                </td>

                <td>
                    <div class="battery-wrapper">
                        <div class="battery-text plugged-in">Plugged In</div>
                    </div>
                </td>

                <td>
                    <button class="btn-adit">Edit</button>
                </td>
            </tr>
           <!------------------->
            <tr>
                <td>
                    <div class="device-info">
                        <div class="icon-box icon-camera"></div>
                        <span class="device-name">Front Door Camera</span>
                    </div>
                </td>

                <td>Porch</td>

                <td>
                    <div class="status-badge badge-standby">
                        <div class="stats-dot"></div>
                        <span>Standby</span>
                    </div>
                </td>

                <td>
                    <div class="battery-wrapper">
                        <div class="battery-bar">
                            <div class="battery-fill" style="width: 60%"></div>
                        </div>
                        <div class="battery-text">60%</div>
                    </div>
                </td>

                <td>
                    <button class="btn-adit">Edit</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
